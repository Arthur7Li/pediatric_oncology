name: CI & QA Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Format Check (Prettier)
        run: npm run format:check

      - name: Type & Component Check (Astro Check)
        run: npm run check

      - name: Build Platform
        run: npm run build

      - name: Check Medical Expiry
        run: node scripts/check-medical-expiry.cjs

  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lychee Broken Link Checker
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: >-
            --verbose --no-progress
            --exclude-path './docs/qa'
            --exclude 'https://www.iwk.nshealth.ca'
            --exclude 'https://www.canada.ca/en/services/benefits/ei'
            --accept 200,204,403
            --timeout 15
            --max-retries 2
            --scheme https --scheme http
            './**/*.md' './**/*.astro'
          fail: true

  accessibility-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install --legacy-peer-deps
          npm run build

      - name: Run Accessibility Audit
        run: |
          npx serve dist -l 3000 &
          npx wait-on http://localhost:3000 --timeout 15000
          npx pa11y-ci --config .pa11yci
