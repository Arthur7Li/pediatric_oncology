name: CI & QA Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Format Check (Prettier)
        run: npm run format:check

      - name: Type & Component Check (Astro Check)
        run: npm run check

      - name: Build Platform
        run: npm run build

      - name: Check Medical Expiry
        run: node scripts/check-medical-expiry.cjs

      - name: Check Charity Expiry
        run: node scripts/check-charity-expiry.cjs

  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lychee Broken Link Checker
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: >-
            --verbose --no-progress
            --exclude-path './docs'
            --exclude 'https://www.iwk.nshealth.ca.*'
            --exclude 'https://.*canada\.ca/.*'
            --exclude 'https://.*sac-isc\.gc\.ca/.*'
            --exclude 'https://.*c17\.ca.*'
            --exclude 'https://.*childrensoncologygroup\.org.*'
            --exclude 'https://.*survivorshipguidelines\.org.*'
            --exclude 'https://philipazizcentre\.ca.*'
            --exclude 'https://canadian-pediatric-oncology\.github\.io.*'
            --exclude 'https://.*stjude\.org.*'
            --exclude 'https://.*chop\.edu.*'
            --exclude 'https://.*alexslemonade\.org.*'
            --exclude 'https://.*childhoodcancer\.ca.*'
            --exclude 'https://.*rmhc\.ca.*'
            --exclude 'https://.*hopeair\.ca.*'
            --exclude 'https://.*pogo\.ca.*'
            --exclude 'https://.*leucan\.qc\.ca.*'
            --exclude 'https://.*alberta\.ca.*'
            --exclude 'https://.*gnb\.ca.*'
            --exclude 'https://.*gov\.nu\.ca.*'
            --exclude 'https://.*yukon\.ca.*'
            --exclude 'https://.*ramq\.gouv\.qc\.ca.*'
            --exclude 'https://.*irvingoil\.com.*'
            --exclude 'https://.*helpingfamilieshandlecancer\.com.*'
            --exclude 'https://.*fnha\.ca.*'
            --exclude 'https://.*cancer\.ca.*'
            --exclude 'https://.*bcchildrens\.ca.*'
            --exclude 'https://.*sickkids\.ca.*'
            --exclude 'https://.*aboutkidshealth\.ca.*'
            --exclude 'https://.*ontario\.ca.*'
            --accept 200,204,301,302,307,308,400,401,403,405,429,500,502,503,530
            --timeout 30
            --max-retries 3
            --scheme https --scheme http
            './**/*.md' './**/*.astro'
          fail: true

  accessibility-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install --legacy-peer-deps
          npm run build

      - name: Install Playwright Chromium & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Accessibility Audit
        run: |
          npx astro preview --port 3000 --host 0.0.0.0 &
          npx wait-on http://localhost:3000/pediatric_oncology/ --timeout 15000
          npm run test:a11y

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install --legacy-peer-deps
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
